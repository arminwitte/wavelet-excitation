[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavelet_excitation"
dynamic = ["version"]
description = "Iterative generation of broadband excitation signals with optimized crest factors using Daubechies wavelets."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Dr. Armin Witte", email = "armin.witte@example.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "PyWavelets>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/wavelet-excitation"
Repository = "https://github.com/YOUR_USERNAME/wavelet-excitation"

# --- Hatchling Configuration ---
[tool.hatch.version]
path = "src/wavelet_excitation/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests"]

# --- Tool Configuration (Ruff & Pytest) ---
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]